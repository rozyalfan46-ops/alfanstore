

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#ffe0ed,#ffd2e6,#fff0f6);
 font-family:Arial,sans-serif;overflow:hidden;color:#e94f88
}
.arena{
 width:100%;max-width:430px;height:600px;
 padding:25px 18px;text-align:center;
 position:relative;overflow:hidden
}
h1{font-size:27px;margin:15px 0}
p{font-size:16px;color:#a64b70;line-height:1.6}
.pentol{
 width:190px;height:210px;margin:25px auto;
 animation:bounce 1.8s infinite ease-in-out
}
@keyframes bounce{
 0%,100%{transform:translateY(0) rotate(-3deg)}
 50%{transform:translateY(-15px) rotate(3deg)}
}
.actions{
 position:absolute;bottom:75px;left:0;width:100%;
 display:flex;justify-content:center;gap:18px
}
button{
 border:0;border-radius:30px;padding:15px 30px;
 font-size:17px;font-weight:bold;
 box-shadow:0 5px 12px #e58aab55;
 touch-action:manipulation
}
#yes{background:#ff5794;color:white}
#no{background:white;color:#ed548b;position:relative}
#success{
 display:none;position:absolute;inset:0;
 background:#fff0f6;z-index:20;
 align-items:center;justify-content:center;
 flex-direction:column;padding:20px
}
.big{font-size:90px;animation:bounce 1s infinite}
.heart{
 position:fixed;bottom:-30px;
 animation:fly 3s linear forwards;
 pointer-events:none;z-index:30
}
@keyframes fly{
 to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
</style>
</head>
<body>

<div class="arena" id="arena">

<h1>Aku mau tanya sesuatu... 🥺</h1>
<p>
Sebenernya aku suka sama kamu.<br>
Kamu mau nggak jadi pacarku? ❤️
</p>

<div class="pentol">
<svg viewBox="0 0 200 220" width="100%" height="100%">
<path d="M75 165 L65 190 M125 165 L135 190"
stroke="#a56b50" stroke-width="12" stroke-linecap="round"/>
<circle cx="100" cy="105" r="75"
fill="#fffdf8" stroke="#e8c9b9" stroke-width="3"/>
<path d="M30 115 Q5 120 20 145 M170 115 Q195 120 180 145"
stroke="#fffdf8" stroke-width="13" fill="none"
stroke-linecap="round"/>
<ellipse cx="75" cy="100" rx="6" ry="9" fill="#42332f"/>
<ellipse cx="125" cy="100" rx="6" ry="9" fill="#42332f"/>
<ellipse cx="58" cy="120" rx="12" ry="7" fill="#ffb6c9"/>
<ellipse cx="142" cy="120" rx="12" ry="7" fill="#ffb6c9"/>
<path d="M88 122 Q100 134 112 122"
stroke="#a56b50" stroke-width="3" fill="none"/>
<path d="M100 58 C80 35 57 55 100 88 C143 55 120 35 100 58"
fill="#ff6b9f"/>
</svg>
</div>

<div class="actions">
<button id="yes">MAU ❤️</button>
<button id="no">TIDAK 😭</button>
</div>

<div id="success">
<div class="big">🥰❤️</div>
<h1>YEAYYY!</h1>
<p>Terima kasih sudah menerima aku ❤️</p>
<div style="font-size:55px">💕 🌸 💕</div>
</div>

</div>

<script>
// GANTI NOMOR INI DENGAN NOMOR WHATSAPP KAMU
const nomorWA = "6281234567890";

const arena = document.getElementById("arena");
const no = document.getElementById("no");

function kabur(e){
 e.preventDefault();

 const area = arena.getBoundingClientRect();
 const btn = no.getBoundingClientRect();

 const maxX = area.width - btn.width - 15;
 const maxY = area.height - btn.height - 15;

 const x = 10 + Math.random() * Math.max(0,maxX-10);
 const y = area.height * 0.55 +
 Math.random() * Math.max(0,maxY-area.height*0.55);

 no.style.position="absolute";
 no.style.left=x+"px";
 no.style.top=y+"px";
}

no.addEventListener("pointerdown",kabur);
no.addEventListener("pointerenter",kabur);
no.addEventListener("click",kabur);

document.getElementById("yes").addEventListener("click",function(){
 document.getElementById("success").style.display="flex";
 no.style.display="none";

 for(let i=0;i<45;i++){
  setTimeout(buatHati,i*80);
 }

 const pesan="Aku sudah jawab pertanyaan kamu. Aku MAU ❤️🥰";

 setTimeout(function(){
  window.location.href=
   "https://wa.me/"+nomorWA+"?text="+encodeURIComponent(pesan);
 },1800);
});

function buatHati(){
 const heart=document.createElement("div");
 heart.className="heart";
 heart.textContent=["❤️","💕","💖","💗","🌸"][
 Math.floor(Math.random()*5)];
 heart.style.left=Math.random()*100+"vw";
 heart.style.fontSize=(20+Math.random()*25)+"px";
 document.body.appendChild(heart);
 setTimeout(()=>heart.remove(),3000);
}
</script>

</body>
</html>
